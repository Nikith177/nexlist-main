<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nexlist - Create Listing</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#197fe6",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111921",
                    },
                    fontFamily: {
                        "display": ["Work Sans"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body { font-family: 'Work Sans', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark flex justify-center">
<div class="w-[390px] min-h-screen bg-white dark:bg-slate-900 shadow-2xl flex flex-col relative overflow-x-hidden">
<!-- Header -->
<header class="flex items-center px-4 py-4 border-b border-slate-100 dark:border-slate-800 sticky top-0 bg-white dark:bg-slate-900 z-10">
<button class="text-slate-900 dark:text-slate-100">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="flex-1 text-center text-lg font-bold text-slate-900 dark:text-slate-100 pr-6">Create Listing</h1>
</header>
<!-- Progress Indicator -->
<div class="flex justify-center gap-2 py-6">
<div class="h-1.5 w-8 rounded-full bg-primary"></div>
<div class="h-1.5 w-8 rounded-full bg-slate-200 dark:bg-slate-700"></div>
<div class="h-1.5 w-8 rounded-full bg-slate-200 dark:bg-slate-700"></div>
<div class="h-1.5 w-8 rounded-full bg-slate-200 dark:bg-slate-700"></div>
</div>
<main class="flex-1 px-4 pb-24">
<!-- Step 1 Title -->
<div class="text-center mb-8">
<h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">What would you like to do?</h2>
<p class="text-slate-500 dark:text-slate-400">Choose the type of listing you want to create</p>
</div>
<!-- Grid: Listing Types -->
<div class="grid grid-cols-2 gap-4 mb-8">
<!-- Sell Item -->
<button class="flex flex-col items-center justify-center p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 shadow-sm hover:border-primary transition-colors group">
<div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center text-primary mb-3 group-hover:bg-primary group-hover:text-white transition-all">
<span class="material-symbols-outlined text-3xl">inventory_2</span>
</div>
<span class="font-bold text-slate-800 dark:text-slate-200">Sell Item</span>
</button>
<!-- Rent Item -->
<button class="flex flex-col items-center justify-center p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 shadow-sm hover:border-primary transition-colors group">
<div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center text-primary mb-3 group-hover:bg-primary group-hover:text-white transition-all">
<span class="material-symbols-outlined text-3xl">vpn_key</span>
</div>
<span class="font-bold text-slate-800 dark:text-slate-200">Rent Item</span>
</button>
<!-- Offer Service -->
<button class="flex flex-col items-center justify-center p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 shadow-sm hover:border-primary transition-colors group">
<div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center text-primary mb-3 group-hover:bg-primary group-hover:text-white transition-all">
<span class="material-symbols-outlined text-3xl">build</span>
</div>
<span class="font-bold text-slate-800 dark:text-slate-200">Offer Service</span>
</button>
<!-- Request Item -->
<button class="flex flex-col items-center justify-center p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 shadow-sm hover:border-primary transition-colors group">
<div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center text-primary mb-3 group-hover:bg-primary group-hover:text-white transition-all">
<span class="material-symbols-outlined text-3xl">search</span>
</div>
<span class="font-bold text-slate-800 dark:text-slate-200">Request Item</span>
</button>
<!-- Give Away Item -->
<button class="flex flex-col items-center justify-center p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 shadow-sm hover:border-primary transition-colors group col-span-2">
<div class="w-12 h-12 rounded-xl bg-primary/10 flex items-center justify-center text-primary mb-3 group-hover:bg-primary group-hover:text-white transition-all">
<span class="material-symbols-outlined text-3xl">featured_seasonal_and_gifts</span>
</div>
<span class="font-bold text-slate-800 dark:text-slate-200">Give Away Item</span>
</button>
</div>
<!-- Basic Details Section -->
<div class="mt-12">
<h3 class="text-xl font-bold text-slate-900 dark:text-white mb-6">Item Details</h3>
<div class="space-y-4">
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Title</label>
<input class="w-full h-12 px-4 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none" placeholder="e.g. Student Bicycle" type="text"/>
</div>
<div class="grid grid-cols-2 gap-4">
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Price</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">₹</span>
<input class="w-full h-12 pl-8 pr-4 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none" placeholder="2500" type="number"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Category</label>
<select class="w-full h-12 px-4 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none appearance-none">
<option>Cycles</option>
<option>Electronics</option>
<option>Furniture</option>
<option>Books</option>
</select>
</div>
</div>
<div>
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Location</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-slate-400 text-xl">location_on</span>
<input class="w-full h-12 pl-12 pr-4 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none" placeholder="e.g. Hostel H7" type="text"/>
</div>
</div>
</div>
</div>
<!-- Photos & Description -->
<div class="mt-12">
<h3 class="text-xl font-bold text-slate-900 dark:text-white mb-4">Photos &amp; Description</h3>
<div class="flex gap-3 overflow-x-auto pb-4 hide-scrollbar">
<button class="w-24 h-24 shrink-0 rounded-2xl border-2 border-dashed border-slate-200 dark:border-slate-700 flex flex-col items-center justify-center text-slate-400 bg-slate-50 dark:bg-slate-800/50">
<span class="material-symbols-outlined">add_a_photo</span>
<span class="text-[10px] mt-1">Add Photos</span>
</button>
<div class="w-24 h-24 shrink-0 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center">
<span class="material-symbols-outlined text-slate-300 dark:text-slate-700">image</span>
</div>
<div class="w-24 h-24 shrink-0 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center">
<span class="material-symbols-outlined text-slate-300 dark:text-slate-700">image</span>
</div>
<div class="w-24 h-24 shrink-0 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center">
<span class="material-symbols-outlined text-slate-300 dark:text-slate-700">image</span>
</div>
</div>
<div class="mt-4">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Description</label>
<textarea class="w-full min-h-[120px] p-4 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-800 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none resize-none" placeholder="Describe your item in detail (brand, usage time, any issues...)"></textarea>
</div>
</div>
<!-- Review & Options -->
<div class="mt-12 mb-8">
<h3 class="text-xl font-bold text-slate-900 dark:text-white mb-4">Options &amp; Review</h3>
<div class="space-y-4 bg-slate-50 dark:bg-slate-800/50 p-4 rounded-2xl border border-slate-100 dark:border-slate-700">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-orange-500">bolt</span>
<span class="text-sm font-medium text-slate-700 dark:text-slate-300">Mark as Urgent</span>
</div>
<div class="w-10 h-6 bg-slate-300 dark:bg-slate-600 rounded-full relative">
<div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full"></div>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-blue-500">payments</span>
<span class="text-sm font-medium text-slate-700 dark:text-slate-300">Allow Negotiation</span>
</div>
<div class="w-10 h-6 bg-primary rounded-full relative">
<div class="absolute right-1 top-1 w-4 h-4 bg-white rounded-full shadow-sm"></div>
</div>
</div>
</div>
<!-- Small Preview -->
<div class="mt-6 flex gap-4 p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm">
<div class="w-16 h-16 rounded-lg bg-slate-100 dark:bg-slate-700 flex items-center justify-center">
<span class="material-symbols-outlined text-slate-300">image</span>
</div>
<div class="flex-1 flex flex-col justify-center">
<p class="text-sm font-bold text-slate-900 dark:text-white leading-tight">Student Bicycle</p>
<p class="text-xs text-primary font-bold">₹2500</p>
<div class="flex items-center text-[10px] text-slate-400 mt-0.5">
<span class="material-symbols-outlined text-[12px] mr-1">location_on</span>
                            Hostel H7
                        </div>
</div>
</div>
</div>
</main>
<!-- Fixed Action Button -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-[390px] p-4 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800">
<button class="w-full h-12 bg-primary hover:bg-primary/90 text-white font-bold rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
                Post Listing
            </button>
</div>
</div>
</body></html>
